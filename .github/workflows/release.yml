name: Release

# Push a tag like v0.1.0 to build installers and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and attach installers to, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: ""   # runner is Apple Silicon; an explicit --target breaks linking whisper.cpp (___isPlatformVersionAtLeast)
          - name: Windows x64
            os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: vs2022
      - name: LLVM for bindgen (whisper.cpp)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Bundled speech model
        shell: bash
        run: bash scripts/fetch-model.sh
      - run: npm ci
      # macOS signing. A stable signature is what lets macOS keep Murmur's permissions across
      # updates: permissions belong to the signing certificate, not to one build.
      #  1. Developer ID (APPLE_CERTIFICATE...) when the repo has it: signed + notarized.
      #  2. Otherwise Murmur's own self-signed certificate (MURMUR_SIGNING_P12): the same
      #     certificate signs every release, so updates keep Microphone/Accessibility.
      #  3. Neither: ad-hoc (every update is a new app to macOS).
      - name: macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          OWN_P12: ${{ secrets.MURMUR_SIGNING_P12 }}
          OWN_PW: ${{ secrets.MURMUR_SIGNING_P12_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$AID" ] && [ -n "$APW" ] && [ -n "$TEAM" ]; then
              { echo "APPLE_ID=$AID"; echo "APPLE_PASSWORD=$APW"; echo "APPLE_TEAM_ID=$TEAM"; } >> "$GITHUB_ENV"
            fi
            echo "Signing with Developer ID"
          elif [ -n "$OWN_P12" ]; then
            KC="$RUNNER_TEMP/murmur-signing.keychain-db"
            KC_PW="$(openssl rand -hex 16)"
            echo "$OWN_P12" | base64 --decode > "$RUNNER_TEMP/murmur.p12"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            security import "$RUNNER_TEMP/murmur.p12" -k "$KC" -P "$OWN_PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            # codesign only uses a certificate trusted for code signing
            openssl pkcs12 -in "$RUNNER_TEMP/murmur.p12" -passin pass:"$OWN_PW" -nokeys -legacy -out "$RUNNER_TEMP/murmur.pem" 2>/dev/null \
              || openssl pkcs12 -in "$RUNNER_TEMP/murmur.p12" -passin pass:"$OWN_PW" -nokeys -out "$RUNNER_TEMP/murmur.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$KC" "$RUNNER_TEMP/murmur.pem"
            rm -f "$RUNNER_TEMP/murmur.p12"
            security find-identity -v -p codesigning "$KC"
            echo "APPLE_SIGNING_IDENTITY=Murmur Code Signing" >> "$GITHUB_ENV"
            echo "Signing with Murmur's own certificate"
          else
            echo "No signing secrets: ad-hoc signed build"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Murmur ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            **macOS (Apple Silicon):** download the `.dmg`, drag Murmur into Applications and open it from there. First launch: right-click Murmur → Open.
            **Windows 10/11:** download the `-setup.exe` and run it (per-user, no admin). If SmartScreen appears, click More info → Run anyway.
            Then follow the setup window: it asks for each permission only when you click it, connects your own Claude or ChatGPT account, and verifies the connection with one test message. Nothing else is downloaded or installed.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      # Fail loudly if the Mac app lacks the microphone entitlement or the stable certificate:
      # without them macOS never shows the mic prompt, or forgets permissions on update.
      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          OWN_P12: ${{ secrets.MURMUR_SIGNING_P12 }}
        run: |
          APP=src-tauri/target/release/bundle/macos/Murmur.app
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|flags|TeamIdentifier" || true
          codesign -d -r- "$APP" 2>&1 | tail -1
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "com.apple.security.device.audio-input" \
            || { echo "::error::Murmur.app is missing the audio-input entitlement"; exit 1; }
          if [ -n "$OWN_P12" ]; then
            codesign -dvv "$APP" 2>&1 | grep -q "Authority=Murmur Code Signing" \
              || { echo "::error::Murmur.app is not signed with Murmur's certificate"; exit 1; }
          fi
          echo "Signature OK"
